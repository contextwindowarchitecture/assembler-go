# The vendored contract against the specification repository at the commit it pins, and the committed conformance report against the
# contract. Both jobs do nothing until the contract is vendored (PORTING.md, step 2).
# A tag runs it through release.yml, on the tagged commit.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; release.yml passes the tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.version }}
      - run: go mod download
      - run: go build ./...
      - run: go test ./...

  report:
    name: committed conformance report is complete and well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python3 scripts/vendor_contract.py --verify
      - run: python3 scripts/check_report.py

  contract:
    name: vendored contract matches the specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: lock
        run: |
          if [ -f vendor/cwa.lock.json ]; then
            python3 -c 'import json; lock = json.load(open("vendor/cwa.lock.json")); print("repository=" + lock["repository"]); print("commit=" + lock["spec_commit"])' >> "$GITHUB_OUTPUT"
          else
            echo "nothing vendored yet (PORTING.md, step 2)"
          fi
      # The locked commit must be pushed to the repository the lock names, the specification repository, for this
      # checkout to find it.
      - if: steps.lock.outputs.commit != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: spec
      - if: steps.lock.outputs.commit != ''
        run: python3 scripts/vendor_contract.py --spec spec --check
